name: musik_m3u_player
description: "M3U Musik & Jellyfin Cinema Player — Offline M3U, Directory Music & Jellyfin Movies (Netflix x Spotify UI)"
publish_to: 'none'
version: 1.8.3+18

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.6
  file_picker: ^13.4.1
  permission_handler: ^13.0.2
  http: ^1.6.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  video_player: ^2.14.1
  package_info_plus: ^10.2.2
  open_file: ^4.0.0
  just_audio_background: ^0.0.1-beta.17
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo2.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "logo2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo2.png"
  adaptive_icon_foreground_inset: 14

flutter_native_splash:
  color: "#FFFFFF"
  image: "logo2.png"
  color_dark: "#F8FAFC"
  image_dark: "logo2.png"
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: "logo2.png"
    color_dark: "#F8FAFC"
    icon_background_color_dark: "#FFFFFF"
    image_dark: "logo2.png"
  web: false
  ios: false
