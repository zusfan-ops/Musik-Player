org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Compile Kotlin in-process & non-incremental untuk menghindari bug lintas drive C:\ PubCache vs D:\ workspace ("Could not close incremental caches")
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.parallel=false
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37
android.newDsl=false
android.builtInKotlin=false
